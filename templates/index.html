<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raster Normalizer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 400px;">
            <h2 class="text-center mb-4 text-primary">Raster Normalizer</h2>
            <p class="text-center text-muted">
                Upload your raster file (.tif) and get a normalized version instantly.
            </p>
            <form method="POST" enctype="multipart/form-data" action="/upload">
                <div class="mb-3">
                    <input class="form-control" type="file" name="raster">
                </div>
                <button class="btn btn-primary w-100">📥 Normalize & Download</button>
            </form>

            <!-- Loading Spinner -->
            <div id="loading" class="text-center mt-3" style="display:none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Processing...</span>
                </div>
                <p class="text-muted mt-2">Processing your raster file...</p>
            </div>

            <footer class="text-center mt-3 text-muted">
                © 2026 Raster Normalizer | Developed by Jannatul
            </footer>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Spinner Script -->
    <script>
        const form = document.querySelector("form");
        form.addEventListener("submit", () => {
            document.getElementById("loading").style.display = "block";
        });
    </script>
</body>
</html>
